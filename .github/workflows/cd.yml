# CD workflow: run tests then deploy to Render on every push to main (README §18.2, R13).
#
# Steps:
# 1. Check out the repository.
# 2. Install Python, uv, and dependencies.
# 3. Start a PostgreSQL service container and apply migrations.
# 4. Run the full test suite.
# 5. Trigger a Render deploy hook (RENDER_DEPLOY_HOOK_URL secret).
# 6. Poll the live /health endpoint until it returns 200 (smoke test).
#    PUBLIC_URL is stored as a GitHub Actions variable (not a secret).

name: CD

on:
  push:
    branches: [main]
    
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: clinic_db_test
          POSTGRES_USER: clinic_user
          POSTGRES_PASSWORD: clinic_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://clinic_user:clinic_pass@localhost:5432/clinic_db_test
      CLINIC_TIMEZONE: Africa/Nairobi
      MIN_BOOKING_LEAD_MINUTES: "60"
      APP_ENV: test
      LOG_LEVEL: WARNING

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --locked

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest clinic_booking_system/tests/ -v

      - name: Deploy to Render
        # Only deploy if tests pass; RENDER_DEPLOY_HOOK_URL is a repository secret..
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is not set"; exit 1
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Smoke test — poll /health
        # Poll the live URL until the service is up (up to 3 minutes).
        # PUBLIC_URL is set as a repository variable (Settings → Variables).
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          if [ -z "$PUBLIC_URL" ]; then
            echo "PUBLIC_URL variable is not set"; exit 1
          fi
          URL="${PUBLIC_URL%/}/health"
          echo "Waiting for deployment to be healthy..."
          for i in $(seq 1 18); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.PUBLIC_URL }}/health" || true)
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed."
              exit 0
            fi
            echo "Attempt $i: got HTTP $STATUS, retrying in 10 s..."
            sleep 10
          done
          echo "Health check failed after 3 minutes."
          exit 1