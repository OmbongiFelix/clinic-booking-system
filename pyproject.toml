[project]
name = "clinic-booking-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "OmbongiFelix", email = "fombongi11@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi>=0.143.2",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
clinic-booking-system = "clinic_booking_system:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
